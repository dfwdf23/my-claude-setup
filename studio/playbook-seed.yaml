# 기본 학습 노트 — 스튜디오가 처음부터 알고 시작하는 제작 원칙입니다.
# 이후 학습 노트는 결재 피드백·QA·성과 데이터에서 자동으로 쌓입니다 (data/playbook).
lessons:
  - { agent: scriptwriter, text: "첫 문장은 결론·반전·숫자 중 하나로 시작한다. '안녕하세요', '오늘은 ~에 대해'로 시작하지 않는다." }
  - { agent: scriptwriter, text: "한 문장에 정보 하나. 한 호흡(약 12~18음절)을 넘기면 문장을 나눈다." }
  - { agent: scriptwriter, format: shorts, text: "쇼츠는 마지막 문장이 첫 문장으로 자연스럽게 이어지게 써서 반복 재생을 유도한다." }
  - { agent: scriptwriter, format: long, text: "롱폼은 30초 안에 '이 영상에서 얻는 것'을 약속하고, 2~3분마다 다음 내용을 예고해 이탈을 막는다." }
  - { agent: producer, text: "기획안의 제목 후보는 서로 다른 심리(궁금증·손실회피·숫자·대비)를 하나씩 쓴다. 비슷한 제목을 여러 개 내지 않는다." }
  - { agent: art-director, text: "모든 장면 프롬프트에 비주얼 바이블의 고정 문구(화풍·조명·색)를 똑같이 넣어 일관성을 지킨다." }
  - { agent: art-director, text: "내레이션이 말하는 대상을 화면 중앙에 크게 둔다. 추상적인 배경 그림으로 때우지 않는다." }
  - { agent: voice-director, text: "숫자·단위·영문 약어는 TTS가 읽을 한글 발음으로 풀어 쓴다 (예: 3.5% → 삼 점 오 퍼센트)." }
  - { agent: motion-designer, text: "자막은 한 화면에 2~4단어. 강조 단어만 색을 바꾸고, 나머지는 흰색으로 둔다." }
  - { agent: packager, text: "썸네일 문구는 제목을 반복하지 않는다. 제목이 질문이면 썸네일은 단서, 제목이 단서면 썸네일은 감정." }
  - { agent: qa-director, text: "첫 3초를 가장 엄격하게 본다. 훅이 약하면 다른 점수가 높아도 '재작업'으로 판정한다." }
  - { agent: sound-designer, text: "음악은 내레이션보다 최소 12dB 낮게 깔고, 훅과 마무리에서만 살짝 올린다." }
