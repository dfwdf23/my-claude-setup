# config.toml 로 복사해 필요한 값만 남기고 바꾸세요. 적지 않은 항목은 기본값을 씁니다.
# 아래 값은 기본값(미국 주식 · 스윙)과 같습니다. 모르는 키를 적으면 시작할 때 오류로 알려 줍니다.

market = "US"                # US(미국 주식) | KRX(국내 주식)
style = "swing"              # swing(일봉으로 판단, 며칠~몇 주 보유) | intraday(분봉 단타 — 실제 시세 검증에서 손실)
mode = "sim"                 # sim(연습) | manual(주문 보조: 내가 직접 체결) | kis-mock(모의투자) | kis-live(실전)
capital = 30000              # 봇이 운용할 최대 금액(미국: 달러). 계좌 잔고가 더 많아도 이만큼만 씁니다

# 감시 후보 종목. 레버리지 ETF(TQQQ·SOXL)는 변동이 크니 원하지 않으면 빼세요.
universe = ["SPY", "QQQ", "TQQQ", "SOXL", "NVDA", "TSLA", "AAPL", "MSFT", "AMD", "META"]
max_symbols = 10

[risk]                       # 학습 에이전트가 바꿀 수 없는 고정 한도
risk_per_trade = 0.005       # 거래 1건이 손절될 때 잃는 금액 = 자산의 0.5%
max_positions = 10           # 동시에 보유하는 종목 수
max_weight = 0.10            # 종목당 최대 비중
max_exposure = 0.95          # 총 주식 비중 상한
max_daily_loss = 0.02        # 당일 -2% → 전량 청산 + 그날 매매 중단
max_drawdown = 0.08          # 고점 대비 -8% → 완전 정지(대시보드에서 [재개]를 눌러야 풀림)

[fees]
commission = 0.0025          # 내 계좌의 해외주식 수수료율(0.25% = 0.0025). 우대 요율이면 고치세요
slippage_ticks = 2           # 검증 때 가정하는 체결 미끄러짐(호가 단위 수)

[learn]
enabled = true               # 장 마감 후 손실 원인 복기
auto_apply = false           # true 면 검증을 통과한 개선안을 자동 적용. 미국 스윙은 제안만 하는 것을 권장

[news]
enabled = true               # 종목별 소식 수집(악재면 매수 보류)
block_min = 30               # 악재 감지 후 그 종목 매수를 막는 시간(분)
exit_on_severe = true        # Claude가 심각한 악재로 확인하면 보유분 청산
exit_min_drop_pct = 1.5      # …단, 가격이 실제로 전일 종가보다 이만큼(%) 이상 내려 있을 때만(0 = 조건 없이 즉시)
max_exits_per_day = 3        # 하루에 소식으로 거는 청산 지시 수의 상한(넘으면 알리기만 한다)

[llm]
enabled = true                      # ANTHROPIC_API_KEY 가 없으면 자동으로 규칙 기반으로만 동작
model_market = "claude-opus-5-5"    # 시장분석. 비용을 줄이려면 "claude-haiku-5-5"
model_news = "claude-opus-5-5"      # 소식 분류. 비용을 줄이려면 "claude-haiku-5-5"
model_review = "claude-opus-5-5"    # 장후 복기(하루 1회)
daily_token_budget = 150000         # 하루 토큰 상한 — 넘으면 규칙 기반으로만 동작

[manual]                     # 주문 보조 모드(mode = "manual")
poll_sec = 20                # 시세를 읽는 간격(초)
ticket_ttl_min = 5           # 주문 제안에 이 시간 안에 답하지 않으면 만료
snooze_min = 30              # 건너뛰었거나 만료된 종목을 다시 제안하기까지(분)

[dashboard]
host = "127.0.0.1"           # 다른 기기에서 보려면 "0.0.0.0" + .env 의 DASHBOARD_TOKEN 필수
port = 8787

[sim]
speed = 120                  # 연습 모드 배속
