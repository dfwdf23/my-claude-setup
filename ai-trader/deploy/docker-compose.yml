# 사용: ai-trader 폴더에서
#   cp config.example.toml config.toml      # 먼저 만들어 두세요(없으면 같은 이름의 빈 폴더가 생겨 시작에 실패합니다)
#   cp .env.example .env                    # 키 입력 + DASHBOARD_TOKEN 설정(컨테이너에서는 필수)
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  aitrader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 한국투자증권 모의투자로 자동 주문. 연습만 하려면 "kis-mock" 을 "sim" 으로 바꾸세요.
    command: ["run", "--mode", "kis-mock", "--host", "0.0.0.0"]
    volumes:
      - ../data:/app/data                    # 매매 일지·전략 파라미터·장부·토큰 캐시 보존
      - ../config.toml:/app/config.toml:ro
      - ../.env:/app/.env:ro                 # 프로그램이 직접 읽습니다
    ports:
      - "127.0.0.1:8787:8787"                # 이 서버 안에서만 열림. 원격에서 볼 때는 SSH 터널 권장: ssh -L 8787:127.0.0.1:8787 서버
    restart: unless-stopped
    stop_grace_period: 30s
